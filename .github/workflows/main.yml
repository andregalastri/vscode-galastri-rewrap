name: Validate and package Galastri Rewrap

on:
  workflow_call:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]

permissions:
  contents: read

concurrency:
  group: vsix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DOTNET_ROLL_FORWARD: Major
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json

      - name: Install build dependencies
        run: npm ci

      - name: Install extension dependencies
        run: npm ci --prefix vscode

      - name: Restore Fable tool
        run: dotnet tool restore

      - name: Restore .NET dependencies
        run: dotnet restore core/Core.Test.fsproj

      - name: Compile F# to JavaScript
        run: dotnet fable core/Core.Test.fsproj -o core/dist/dev --noRestore

      - name: Bundle core
        run: npx --no-install parcel build core --cache-dir .obj/parcel

      - name: Bundle core tests
        run: npx --no-install parcel build core/test --cache-dir .obj/parcel

      - name: Test core
        run: node core/test/prod.js

      - name: Test forced wrapping
        run: node core/test/force.mjs

      - name: Check Ataula wrapping
        run: node vscode.test/ataula.cjs

      - name: Typecheck extension
        run: npx --no-install tsc -p vscode --noEmit

      - name: Lint extension
        run: npx --no-install eslint vscode --ext .ts

      - name: Bundle extension
        run: npx --no-install parcel build vscode --no-source-maps --cache-dir .obj/parcel

      - name: Prepare extension README
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          fs.writeFileSync('vscode/README.md', fs.readFileSync('README.md', 'utf8').replaceAll('.svg', '.png'))
          JS

      - name: Package VSIX
        working-directory: vscode
        run: npx --no-install vsce package -o ../.obj/galastri-rewrap.vsix

      - name: Test VS Code commands
        run: xvfb-run -a node vscode.test/run.cjs

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: galastri-rewrap-vsix
          path: .obj/galastri-rewrap.vsix
          if-no-files-found: error
          retention-days: 30
